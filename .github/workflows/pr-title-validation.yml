---
name: 🔍 Validate PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: 🔎 Validate PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Check PR Title Follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure which types are allowed (aligned with release-please config)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Require a scope (optional - set to false if you don't want to require scopes)
          requireScope: false
          # Subjects (PR title after type/scope) must not be sentence-case, start-case, pascal-case, or upper-case
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            ⚠️ The subject "{subject}" found in the pull request title "{title}" didn't match the configured pattern. 
            Please ensure that the subject doesn't start with an uppercase character.

            Reference the Conventional Commits specification for more details: https://www.conventionalcommits.org/en/v1.0.0
          # Ensure the PR title is not too long
          headerPattern: '^(\w+)(?:\(([^\)]+)\))?!?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
          # Validate that the PR body contains a description for breaking changes
          validateSingleCommit: false
          ignoreLabels: |
            skip-changelog
            dependencies
